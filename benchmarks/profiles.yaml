# Hardware profiles. A profile is a machine (or a well-defined container on one)
# whose cells are only comparable with each other. Adding one is a deliberate
# act: an unknown profile in a run manifest is a schema error, not a warning.
#
# The body of `zen5-cpu` lives in campaign-toolkit
# (`campaign_toolkit/profiles/zen5-cpu.yaml`): a profile is a fact about a machine,
# not about a campaign, so this repository *names* the profiles it measures. Its
# heterogeneous L3 (CPUs 0-3 share 16 MiB, CPUs 4-11 share 8 MiB) is why a thread
# budget is declared together with the CPU set it sits in, and why the recorded
# cells are `1T on CPU 4` and `4T on CPUs 4-7`.
schema_version: 1
profiles:
  - zen5-cpu
