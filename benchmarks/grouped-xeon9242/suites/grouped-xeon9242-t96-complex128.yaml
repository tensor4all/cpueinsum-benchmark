workloads:
  name: |-
    symtn grouped-GEMM corpus, itebd-heff-c853d94f-t96-x86_64, complex128
  description: |-
    Spin-1/2 Heisenberg chain with U(1) and SU(2) symmetry: iTEBD with SVD truncation at chi = 64, 256 and 1024 states, then the two-site H_eff matvec on the converged bond. Every grouped GEMM call the default dense executor received, identical calls merged with a multiplicity. The job list of a call (offsets, m, n, k, leading dimensions) is the capture's; the operand values are the harness's small-integer fill.
  source: |-
    `gemm-trace-corpus/itebd-heff-c853d94f-t96-x86_64.jsonl.gz` of Ryo-wtnb11/symtn-rs at `pins/symtn-gemm-trace.rev`, materialised by `scripts/setup_extern_deps.sh`, which refuses a file whose SHA-256 is not the one the corpus README lists. 92 of the capture's 225 call records have this dtype.
  known_blind_spots:
  - A sample is warm-cache back-to-back replay of one call; the cache state between the calls of the real
    run is not reproduced.
  - 'The host is `xeon9242-cpu`, pinned by its thread rows. Its NUMA conditions (row placement, memory
    policy, automatic NUMA balancing) are the profile''s `numa` block, and each run records the node layout
    and balancing it found in `host.numa`. Boost/turbo is not switched off on this host: runs are recorded
    under `FBENCH_ALLOW_BOOST=1`, so cells compare within this host only and are not a boost-off baseline.'
  - 'Per-call grouping depends on symtn''s engine width at capture: widths 1, 4 and 8 replay the 4-thread
    capture, full width replays the full-width capture.'
  - 'Every call has ops N,N and alpha = 1, and no call is non-compact: lazy adjoints, scaled updates and
    leading dimensions are not exercised.'
  - 'No DMRG sweep: H_eff on the iTEBD-converged bond stands in for the Lanczos matvec.'
  - First touch of every buffer is on the main thread.
