engines_doc:
  sequential:
    provider: cpueinsum
    summary: '`cpueinsum::GroupedPlan` under `BatchStrategy::Sequential`: the jobs of the call one after
      another, each on the whole team.'
    identity: the measured cpueinsum-rs revision in this run's manifest (`library.commit`), pinned by
      `pins/cpueinsum-rs-grouped.rev`
    caveat: 'The reference of the checked twin: every other row is compared with it, bitwise, at the same
      width.'
  outer:
    provider: cpueinsum
    summary: '`GroupedPlan` under `BatchStrategy::Outer`: jobs split over lanes of the team, one thread
      per job.'
    identity: as `sequential`
    caveat: A one-job call has one lane, so it runs serially; the observed route is in `route_observed`.
  auto:
    provider: cpueinsum
    summary: '`GroupedPlan` under `BatchStrategy::Auto`: the route cpueinsum''s current selector picks
      for the call and the width.'
    identity: as `sequential`
    caveat: The selector is the subject of the fit this campaign feeds (tensor4all/cpueinsum-rs#80); its
      pick is recorded per cell in `route_observed`.
  inner:
    provider: cpueinsum
    summary: '`GroupedPlan` under `BatchStrategy::Inner`: every job on all threads of the team, one after
      another.'
    identity: as `sequential`
    caveat: The only native route that gives a one-job call more than one thread.
  blas:
    provider: openblas
    summary: '`cpueinsum_blas::GroupedPlan` on the linked vendor (OpenBLAS on Linux), one vendor GEMM
      per job inside the caller''s team.'
    identity: the vendor the harness reports in `binary-info.txt` (`vendor.name`); OpenBLAS reports its
      version and build (`openblas_get_config`), and its thread count is set to the row's width and read
      back
    caveat: A call the vendor plan declines runs natively and is reported as a skipped cell, not timed
      as `blas`.
