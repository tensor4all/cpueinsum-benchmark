schema_version: 1
id: grouped-xeon9242

# The grouped-GEMM route campaign of #18 on the x86_64 host (`xeon9242-cpu`, an exclusive lg
# compute node, pinned). It is the sibling of `benchmarks/grouped-m4max/campaign.yaml`, selected
# with `CAMPAIGN_DESCRIPTOR=benchmarks/grouped-xeon9242/campaign.yaml`, for the same three
# reasons, each a property of one host:
#   * the corpus a width replays is the host's own capture (decision 4 on #18), and the harness
#     takes that assignment as `--width-capture`, which only `measured.harness_args` can carry;
#   * the `blas` row's provider is the host's vendor (Accelerate here, OpenBLAS on x86_64), and
#     an engine maps to one provider per descriptor;
#   * its pages must not share an index with another host's (decision 3 on #18).
# Everything else (pins, harness, rows, timing contract, columns) is the M4 Max descriptor's.
measured:
  name: cpueinsum-rs
  url: https://github.com/tensor4all/cpueinsum-rs
  # Its own pin, not the einsum campaign's (decision 2 on #18).
  pin_file: pins/cpueinsum-rs-grouped.rev
  extern_dir: extern/cpueinsum-rs-grouped
  build_script: scripts/build_for_cpueinsum_rev.sh
  # `crates/cpueinsum-replay` of the measured checkout, installed into `BIN_DIR` by the build
  # script, so `binary.sha256` is the hash of the binary built out of the pinned checkout.
  binary: cpueinsum-replay
  # The corpus directory and the capture each width replays: this host's 4-thread capture at
  # widths 1, 4 and 8, its 96-thread (full-width) capture at 96. Appended to every `verify` and
  # `run`.
  harness_args:
    - --corpus-dir
    - extern/symtn-gemm-trace/gemm-trace-corpus
    - --width-capture
    - 1=itebd-heff-c96fb0c9-t4-x86_64,4=itebd-heff-c96fb0c9-t4-x86_64,8=itebd-heff-c96fb0c9-t4-x86_64,96=itebd-heff-c853d94f-t96-x86_64
  pin_env:
    rev: CPUEINSUM_REV
    dirty: CPUEINSUM_DIRTY
    dir: CPUEINSUM_DIR
    features: BUILD_FEATURES
    bin_dir: BIN_DIR
  protocol: campaign

identities: [library]

profiles_file: benchmarks/profiles.yaml
suites_dir: benchmarks/grouped-xeon9242/suites
data_dir: data/v2-results/grouped-xeon9242
result_dir: result-v2/grouped-xeon9242

# Four routes of `cpueinsum::GroupedPlan` and the vendor GEMM loop of `cpueinsum-blas`. Off
# macOS the harness links `libopenblas` (`openblas-src`, feature `system`), so that row is the
# OpenBLAS arm, the default x86_64 vendor arm accepted on #18. Which `libopenblas.so.0` the
# loader resolves is the run's, and `binary-info.txt` records its version, build and thread
# limit; the harness refuses a library whose thread read-back is not the row's width.
#
# No `blas` row at width 96 (decided on #18): the 96-thread suites declare the four native rows
# only (`gen_grouped_suite.py --rows sequential,outer,auto,inner`), so that cell is vendor-free.
# The stock el8 OpenBLAS (0.3.15) is the single-threaded build, the threaded builds available on
# the cluster stop at 64 threads, and a self-built 96-thread library is not the stock vendor
# baseline: it would need its own provenance in every table. A full-width vendor comparison, if
# it is wanted later, is a separately labelled `loader_paths` arm, not this `blas` row.
# OPEN (#18): the same single-threaded stock library is refused at widths 4 and 8 too, so until
# a threaded OpenBLAS is chosen the `blas` row of the 4-thread suites can only run at width 1.
#
# Four rows make one rotation cycle of four process sets, so the 96-thread suites are recorded
# with `--aa 4`; the 1/4/8-thread suites keep the five-row `aa: 5` below.
engines:
  sequential: cpueinsum
  outer: cpueinsum
  auto: cpueinsum
  inner: cpueinsum
  blas: openblas

vendor_providers: [openblas]
external_providers: []

# The harness sets the vendor's thread count from the row's width (`openblas_set_num_threads`,
# read back), so no inherited value may reach it.
vendor_env:
  - RAYON_NUM_THREADS
  - OMP_NUM_THREADS
  - VECLIB_MAXIMUM_THREADS
  - OPENBLAS_NUM_THREADS
  - MKL_NUM_THREADS

csv_columns:
  - regime
  - family
  - dtype
  - order
  - m
  - n
  - k
  - batch
  - row
  - threads
  - total_ms
  - per_item_us
  - status
  - note
  - samples_ms
  - rayon_threads
  - vendor_threads
  - case_m
  - case_n
  - case_k
  - capture
  - capture_sha256
  - job_m
  - job_n
  - job_k
  - route_observed
  - inner_calls

page_name: "{library12}{version}{dirty}{timing}"

default_invalidated_by:
  - crates/cpueinsum-replay/**
  - crates/cpueinsum-bench/**
  - crates/cpueinsum/**
  - crates/cpueinsum-blas/**
  - Cargo.toml
  - Cargo.lock

# Turbo cannot be switched off on the lg nodes (`intel_no_turbo=0`), so every run of this
# descriptor is recorded with `FBENCH_ALLOW_BOOST=1` (decided on #18). That is a recorded
# deviation: the manifest's `host.power` carries the turbo state and the suites' blind spots say
# it. Cells compare within this host; they are not a boost-off baseline.
#
# The campaign's frozen v2 contract, except `aa`: the recorder requires whole rotation cycles
# over the declared engine rows, and this suite declares five, so the smallest legal A/A is 5
# process sets (the einsum campaign's 2 is one cycle over its two rows).
timing:
  version: 2
  aa: 5
  reps: 5
  prime_ms: 250

report:
  verdicts: false
  library_label: cpueinsum-rs commit
  provider_label: GroupedPlan routes
  harness_label: harness commit
  index_generator: scripts/v2/gen_index.py
  setup_script: scripts/setup_extern_deps.sh
  verify_note: |-
    Every row below passed `{binary} verify` on the same grid before timing. The operands are small
    integers, so every summation order, blocking and FMA gives the same value: `sequential` is compared
    with a naive definition and every other row with `sequential` at the same width, with exact (IEEE)
    equality, and every output is NaN-filled before the call so a slot that is never written fails.
    Times are milliseconds per call, the median of the chronological samples of each cell; one sample
    batches enough back-to-back calls to last at least 1 ms.
