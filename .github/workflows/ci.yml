name: ci
on: [push, pull_request]
# The measurement itself runs locally: `scripts/v2/record_run.py` builds, verifies and times
# the pinned checkout on the host that owns the numbers, and refuses to publish otherwise, so
# the harness's buildability is proven where it matters (and gated again in cpueinsum-rs's own
# CI, which builds and tests `crates/cpueinsum-bench` on every PR there). What is left for this
# repository is content: the declarations, every recorded manifest, and the generated index.
# That is one small job on the smallest runner, and it is the only required check on `main`.
jobs:
  content:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # campaign-check-generated compares against origin/main
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Checkout the measured revision and the instance corpus
        run: ./scripts/setup_extern_deps.sh
      - name: Declarations are well formed
        run: python3 -m campaign_toolkit.declarations
      - name: The suite declares exactly the pinned corpus's instances, minus the documented exclusions
        # The suite is generated from the harness's census over this corpus. A corpus bump that
        # was not followed by a regeneration would leave the declaration naming instances the
        # corpus no longer has (or missing ones it gained), and nothing else here would notice.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          sys.path.insert(0, 'scripts')
          from gen_suite_from_census import EXCLUDED
          suites = [yaml.safe_load(p.read_text()) for p in sorted(pathlib.Path('benchmarks/suites').glob('*.yaml'))]
          assert suites, 'no suites declared'
          corpus = {json.loads(p.read_text())['name'] for p in
                    sorted(pathlib.Path('extern/tenferro-einsum-benchmark/data/instances').glob('*.json'))}
          expected = corpus - set(EXCLUDED)
          for suite in suites:
              declared = {f for families in suite['family_groups'].values() for f in families}
              assert declared == expected, (
                  f"{suite['id']}: declared but not expected {sorted(declared - expected)}, "
                  f'expected but not declared {sorted(expected - declared)}')
          print(f"{len(suites)} suite(s) declare the pinned corpus's {len(expected)} instances; "
                f"not declared (with a reason in gen_suite_from_census.py): {sorted(EXCLUDED)}")
          PY
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          # data/v2-results/<suite>/<profile>/<suite>/<timestamp>/run.yaml
          files=(data/v2-results/*/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/v2/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/v2/gen_index.py --check
      - name: Nothing generated was edited by hand
        # every published page is its run's report.md byte for byte, and the runs changed against
        # main regenerate their report.md from their CSVs (the index is checked by the step above)
        run: campaign-check-generated --base origin/main --no-index
      - name: Pins are the stack's
        run: campaign-sync-pins --check --repo cpueinsum-benchmark
