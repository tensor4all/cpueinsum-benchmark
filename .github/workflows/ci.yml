name: ci
on: [push, pull_request]
# The measurement itself runs locally: `scripts/v2/record_run.py` builds, verifies and times
# the pinned checkout on the host that owns the numbers, and refuses to publish otherwise, so
# the harness's buildability is proven where it matters (and gated again in cpueinsum-rs's own
# CI, which builds and tests `crates/cpueinsum-bench` on every PR there). What is left for this
# repository is content: the declarations, every recorded manifest, and the generated index.
# That is one small job on the smallest runner, and it is the only required check on `main`.
jobs:
  content:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # campaign-check-generated compares against origin/main
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Checkout the measured revisions and the corpora (digest-checked GEMM corpus included)
        run: ./scripts/setup_extern_deps.sh
      - name: Declarations are well formed
        run: python3 -m campaign_toolkit.declarations
      - name: The suite declares exactly the pinned corpus's instances, minus the documented exclusions
        # The suite is generated from the harness's census over this corpus. A corpus bump that
        # was not followed by a regeneration would leave the declaration naming instances the
        # corpus no longer has (or missing ones it gained), and nothing else here would notice.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          sys.path.insert(0, 'scripts')
          from gen_suite_from_census import EXCLUDED
          suites = [yaml.safe_load(p.read_text()) for p in sorted(pathlib.Path('benchmarks/suites').glob('*.yaml'))]
          assert suites, 'no suites declared'
          corpus = {json.loads(p.read_text())['name'] for p in
                    sorted(pathlib.Path('extern/tenferro-einsum-benchmark/data/instances').glob('*.json'))}
          expected = corpus - set(EXCLUDED)
          for suite in suites:
              declared = {f for families in suite['family_groups'].values() for f in families}
              assert declared == expected, (
                  f"{suite['id']}: declared but not expected {sorted(declared - expected)}, "
                  f'expected but not declared {sorted(expected - declared)}')
          print(f"{len(suites)} suite(s) declare the pinned corpus's {len(expected)} instances; "
                f"not declared (with a reason in gen_suite_from_census.py): {sorted(EXCLUDED)}")
          PY
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          # data/v2-results/<suite>/<profile>/<suite>/<timestamp>/run.yaml
          files=(data/v2-results/cpueinsum/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/v2/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/v2/gen_index.py --check
      - name: Nothing generated was edited by hand
        # every published page is its run's report.md byte for byte, and the runs changed against
        # main regenerate their report.md from their CSVs (the index is checked by the step above)
        run: campaign-check-generated --base origin/main --no-index
      - name: Pins are the stack's
        run: campaign-sync-pins --check --repo cpueinsum-benchmark
      # The grouped-GEMM route campaign (#18) has its own descriptor; the setup step above has
      # already refused a cpueinsum-rs pin before 1ca7431 and a capture whose digest is not the
      # corpus README's.
      - name: Route campaign declarations are well formed
        env:
          CAMPAIGN_DESCRIPTOR: benchmarks/grouped-m4max/campaign.yaml
        run: python3 -m campaign_toolkit.declarations
      - name: Each route suite declares exactly its capture's calls of its dtype
        # One suite per (capture, dtype), regenerated by scripts/gen_grouped_suite.py. A corpus pin
        # bump that was not followed by a regeneration would leave a suite naming calls the
        # capture no longer has, or missing ones it gained.
        run: |
          python3 - <<'PY'
          import gzip, json, pathlib, yaml
          desc = yaml.safe_load(pathlib.Path('benchmarks/grouped-m4max/campaign.yaml').read_text())
          args = desc['measured']['harness_args']
          corpus = pathlib.Path(args[args.index('--corpus-dir') + 1])
          widths = {}
          for entry in args[args.index('--width-capture') + 1].split(','):
              w, stem = entry.split('=')
              widths.setdefault(stem, []).append(int(w))
          dtype_of = {'F64': 'float64', 'C64': 'complex128'}
          suites = sorted(pathlib.Path(desc['suites_dir']).glob('*.yaml'))
          assert suites, 'no route suites declared'
          covered = set()
          for path in suites:
              suite = yaml.safe_load(path.read_text())
              families = {f for fs in suite['family_groups'].values() for f in fs}
              stems = {f.split(':')[0] for f in families}
              assert len(stems) == 1, f'{path}: families from {sorted(stems)}'
              stem = stems.pop()
              run = suite['runs'][0]
              assert len(run['dtypes']) == 1, f'{path}: dtypes {run["dtypes"]}'
              dtype = run['dtypes'][0]
              assert sorted(run['threads']) == sorted(widths.get(stem, [])), (
                  f'{path}: threads {run["threads"]}, --width-capture gives {stem} {widths.get(stem)}')
              with gzip.open(corpus / f'{stem}.jsonl.gz', 'rt') as handle:
                  records = [json.loads(line) for line in handle][1:]
              expected = {f'{stem}:r{i:03d}' for i, r in enumerate(records) if dtype_of[r['dtype']] == dtype}
              assert families == expected, (
                  f'{path}: declared but not in the capture {sorted(families - expected)[:5]}, '
                  f'in the capture but not declared {sorted(expected - families)[:5]}')
              covered.add((stem, dtype))
          missing = {(s, d) for s in widths for d in dtype_of.values()} - covered
          assert not missing, f'no suite for {sorted(missing)}'
          print(f'{len(suites)} route suite(s) declare exactly their capture calls')
          PY
      - name: Route campaign manifests validate and its index is current
        env:
          CAMPAIGN_DESCRIPTOR: benchmarks/grouped-m4max/campaign.yaml
        run: |
          shopt -s nullglob
          files=(data/v2-results/grouped-m4max/*/*/*/run.yaml)
          if [ ${#files[@]} -gt 0 ]; then python3 scripts/v2/validate_run.py "${files[@]}"; fi
          python3 scripts/v2/gen_index.py --check
